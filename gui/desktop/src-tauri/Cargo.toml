[package]
name = "airllm-desktop"
version = "0.1.0"
description = "AirLLM Native Desktop App"
authors = ["PSP-YN"]
license = "Apache-2.0"
repository = "https://github.com/PSP-YN/airllm-gui"
edition = "2021"

[lib]
name = "airllm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
